<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <style>
      *{
        padding: 0;
        margin: 0;
      }
      html, body{
        width: 100%;
        height: 100%;
      }
      .test{
        width: 7.5rem;
        height: 2rem;
        background: yellowgreen;
        font-size: 0.28rem;
        line-height: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="test">Only test</div>
  </body>
  <script>
    // 动态设置缩放，让chrome调试的时候能看见对应的px值，而不用查代码
    function fixPixelRatio () {
      var scale = 1 / window.devicePixelRatio;
      var meta= '<meta name="viewport" content="initial-scale=' + scale + ', maximum-scale=' + scale + ',' + ' minimum-scale=' + scale + ', width=device-width,' + ' user-scalable=no" />';
      document.write(meta);
    }

    // 设置font-size
    function displayRem () {
      var designW = 750;  //设计稿宽
      // 定义75px=1rem 且设计稿750px = offsetWidth 那么 offsetWidth = 10rem，由于1rem=fontSize，所以fontSize = offsetWidth/10
      var font_rate = 75;

      var ratio = designW / font_rate
      //适配
      document.getElementsByTagName("html")[0].style.fontSize = document.body.offsetWidth / ratio + "px";
      //监测窗口大小变化
      window.addEventListener("orientationchange" in window ? "orientationchange" : "resize", function () {
          document.getElementsByTagName("html")[0].style.fontSize = document.body.offsetWidth / ratio + "px";
      }, false);
    }
    fixPixelRatio()
    displayRem()
  </script>
  </html>
