<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表单示例</title>
  </head>
  <body>
    <form action="/xxx" method="post">
      <label for="username">用户名：</label>
      <input type="text" id="username" name="username" required /><br /><br />

      <label for="userPhone">手机号码:</label>
      <input type="tel" name="userPhone" id="userPhone" pattern="^1\d{10}$"><br /><br />

      <label for="email">邮箱：</label>
      <input type="email" id="email" name="email" required /><br /><br />

      <label for="url">url：</label>
      <input type="url" id="url" name="url" required /><br /><br />

      <label for="password">密码：</label>
      <input type="password" id="password" name="password" required /><br /><br />

      <label for="confirm_password">确认密码：</label>
      <input type="password" id="confirm_password" name="confirm_password" required /><br /><br />

      <label for="gender">性别：</label>
      <input type="radio" id="male" name="gender" value="male" />
      <label for="male">男</label>
      <input type="radio" id="female" name="gender" value="female" />
      <label for="female">女</label><br /><br />

      <label for="score">入学成绩:</label>
      <input type="number" max="100" min="0" value="0" id="score"><br /><br />

      <label for="color">颜色:</label>
      <input type="color" name="color"/><br /><br />

      <label for="range">区域:</label>
      <input type="range" name="range"/><br /><br />

      <label for="yearTime">日期-选取日、月、年 :</label>
      <input type="date" id="yearTime" name="yearTime"><br /><br />

      <label for="monthTime">日期-选取月、年:</label>
      <input type="month" id="monthTime" name="monthTime"><br /><br />

      <label for="weekTime">日期-选取周和年:</label>
      <input type="week" id="weekTime" name="weekTime"><br /><br />

      <label for="timeTime">日期-选取时间（小时和分钟） :</label>
      <input type="time" id="timeTime" name="timeTime"><br /><br />

      <label for="datetime-local">日期-选取时间、日、月、年（本地时间） :</label>
      <input type="datetime-local" id="datetime-local" name="datetime-local"><br /><br />

      <label for="search">搜索</label>
      <input type="search" id="search" name="search" required /><br /><br />

      <label for="fileName">文件:</label>
      <input type="file" id="fileName" name="fileName"><br /><br />

      <label for="interests">兴趣：</label><br />
      <input type="checkbox" id="coding" name="interests" value="coding" />
      <label for="coding">编程</label><br />
      <input type="checkbox" id="reading" name="interests" value="reading" />
      <label for="reading">阅读</label><br />
      <input type="checkbox" id="music" name="interests" value="music" />
      <label for="music">音乐</label><br /><br />

      <label for="comments">评论：</label><br />
      <textarea id="comments" name="comments" rows="4" cols="50"></textarea><br /><br />

      <label for="country">国家：</label>
      <select id="country" name="country">
        <option value="china">中国</option>
        <option value="usa">美国</option>
        <option value="uk">英国</option>
        <option value="japan">日本</option>
      </select>
      <br />

      <input type="submit" value="提交" />
    </form>
  </body>
</html>
