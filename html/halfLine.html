<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0.5px Line with SVG</title>
    <style>
        svg {
            width: 100%;
            height: 1px;
        }
        line {
            stroke: black;
            stroke-width: 0.5;
        }
        .line {
          width: 100%;
          height: 1px;
          background-color: black;
          transform: scaleY(0.5);
          transform-origin: 0 0;
        }
    </style>
</head>
<body>
    <svg>
        <line x1="0" y1="0" x2="100%" y2="0" />
    </svg>
    <div class="line"></div>
</body>
</html>
