<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 50px;

      height: 50px;

      background: blue;
      }

      @keyframes move {

      0% { transform: translateX(0px); }

      100% { transform: translateX(200px); }

      }
      /* 0%是translateX(0px); 100%是translateX(200px); */
      .box-start {
        /* 动画开始时立即执行第一步，从50px开始到100%, */
        animation: move 2s steps(4, start) infinite;
      }
      .box-end {
        /* 只停留0% 最后一步是 150px */
        animation: move 2s steps(4, end) infinite;
      }
      .box-none {
        /* 0%和100%都会停留 */
        animation: move 2s steps(4, jump-none) infinite;
      }
      .box-both {
        animation: move 2s steps(4, jump-both) infinite;
      }
  </style>
</head>
<body>
  <div class="box box-start">start</div>
  <div class="box box-end">end</div>
  <div class="box box-none">none</div>
  <div class="box box-both">both</div>
</body>
</html>
