<!DOCTYPE html>
<html>
<head>
    <title>扫码登录</title>
    <style>
        .container {
            width: 300px;
            margin: 50px auto;
            text-align: center;
        }
        #qrcode {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
        }
        .status {
            color: #666;
            margin: 10px 0;
        }
        .countdown {
            color: #f00;
        }
        .scan-success {
            animation: scaleOut 1s ease-in-out;
        }

        @keyframes scaleOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>扫码登录</h2>
        <div id="qrcode"></div>
        <div class="status" id="status">正在生成二维码...</div>
        <div class="countdown" id="countdown"></div>
        <button onclick="refreshQRCode()">刷新二维码</button>
        <div id="status-icon"></div>
    </div>

    <script>
        let currentToken = null;
        let pollInterval = null;
        const qrCodeEle = document.getElementById('qrcode')

        // 显示错误提示
        function showErrorToast(message) {
            const toast = document.createElement('div');
            toast.style = 'position:fixed; bottom:20px; background:red; color:white; padding:10px;';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // 页面加载后自动获取二维码
        window.onload = function() {
            fetchQRCode();
        };

        // 获取二维码
        async function fetchQRCode() {
            try {
                const response = await fetch('/api/qrcode');
                const data = await response.json();
                console.log('手机端访问连接：', `http://localhost:3000/confirm?token=${data.token}&userId=${data.userId}`);
                // 显示二维码
                const qrcodeImg = document.createElement('img');
                qrcodeImg.src = data.qrcode;
                qrCodeEle.appendChild(qrcodeImg);
                // 更新状态
                document.getElementById('status').textContent = '等待扫码';
                currentToken = data.token;
                // 启动倒计时
                startCountdown(data.expiresIn);
                // 开始轮询状态
                startPolling(data.token);
            } catch (error) {
                console.error('获取二维码失败:', error);
                document.getElementById('status').textContent = '二维码生成失败';
            }
        }

        function removeQRCode() {
          const ele = document.getElementsByTagName('img')[0]
          qrCodeEle.removeChild(ele)
          const textEle = document.createElement('span')
          textEle.innerText = '已完成'
          qrCodeEle.appendChild(textEle)
        }

        // 启动倒计时
        function startCountdown(seconds) {
            let remaining = seconds;
            const countdownElement = document.getElementById('countdown');
            const timer = setInterval(() => {
                remaining--;
                countdownElement.textContent = `剩余时间：${remaining}秒`;
                if (remaining <= 0) {
                    clearInterval(timer);
                    countdownElement.textContent = '二维码已过期';
                    document.getElementById('status').textContent = '请刷新页面重新获取';
                }
            }, 1000);
        }

        let isLock = false
        // 轮询检查登录状态
        async function startPolling(token) {
          if (isLock) return
          // 在check-login请求失败时自动重试
          try {
            const response = await fetch(`/api/check-login?token=${token}`);
            const result = await response.json();
            updateStatus(result.status)
            if (result.status === 'confirmed') {
              isLock = true
              handleLoginSuccess(result.user);
            } else if (result.status === 'expired') {
                document.getElementById('status').textContent = '二维码已过期';
            } else if (result.status === 'see') {
              document.getElementById('status').textContent = '已扫码';
              await new Promise(resolve => setTimeout(resolve, 2000));
              startPolling(token);
              removeQRCode()
            } else if (result.status === 'waiting') {
              await new Promise(resolve => setTimeout(resolve, 2000));
              startPolling(token);
            }
          } catch (err) {
            updateStatus('waiting')
            console.log('请求失败，2秒后重试');
            await new Promise(resolve => setTimeout(resolve, 2000));
            return startPolling(token);
          }
        }

        // 登录成功处理
        function handleLoginSuccess(user) {
            document.getElementById('status').textContent = '登录成功！';
            document.getElementById('countdown').textContent = '';
            // 保存用户信息到本地存储
            localStorage.setItem('user', JSON.stringify(user));
        }

        // 手动刷新二维码
        function refreshQRCode() {
            document.getElementById('qrcode').innerHTML = '';
            document.getElementById('status').textContent = '正在生成二维码...';
            document.getElementById('countdown').textContent = '';
            fetchQRCode();
        }

        // 在页面添加状态图标
        const statusIcons = {
          waiting: '⏳',
          confirmed: '✅',
          expired: '❌',
          see: '👊'
        };

        function updateStatus(status) {
          document.getElementById('status-icon').textContent = statusIcons[status];
        }
    </script>
</body>
</html>
