<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>receive</title>
</head>
<body>
  <script>
    // 接收消息的页面
    window.addEventListener('storage', (e) => {
      if(e.key === 'tab_comm') {
        const data = JSON.parse(e.newValue);
        console.log('Storage Message:', data);
      }
    });
  </script>
</body>
</html>
