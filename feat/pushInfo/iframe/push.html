<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>push</title>
</head>
<body>
<iframe src="http://localhost:4000/receive.html" frameborder="0" id="frame" onload="load()"></iframe>
</body>
<script>
function load() {
  let frame = document.getElementById('frame');
  frame.contentWindow.postMessage('push','http://localhost:4000'); //发送数据
  window.onmessage = function(e){// 接受返回数据
    if(e.source === frame.contentWindow) {
      console.log(e.data);
    }
  }
}
</script>
</html>
