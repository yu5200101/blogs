<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>push</title>
</head>
<body>
  <script>

    // 页面代码（发送和接收）
    // 注册Service Worker
    navigator.serviceWorker.register('./sw.js');

    // 发送消息
    navigator.serviceWorker.controller.postMessage({
      type: 'TAB_MSG',
      data: 'Hello via SW'
    });
  </script>
</body>
</html>
