M<!DOCTYPE html>
<html>
<head>
    <style>
        .autocomplete {
            position: relative;
            display: inline-block;
        }

        .autocomplete-items {
            position: absolute;
            border: 1px solid #d4d4d4;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
        }

        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            background-color: #fff;
            border-bottom: 1px solid #d4d4d4;
        }

        .autocomplete-items div:hover {
            background-color: #e9e9e9;
        }

        .autocomplete-active {
            background-color: DodgerBlue !important;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="autocomplete">
    <input type="text" id="myInput" placeholder="请输入国家名称">
    <div id="autocomplete-list" class="autocomplete-items"></div>
</div>

<script>
// 示例数据
const countries = [
    "China", "United States", "Japan", "Germany",
    "France", "Brazil", "Italy", "Canada",
    "South Korea", "Australia", "Russia", "Spain"
];

const input = document.getElementById("myInput");
const autocompleteList = document.getElementById("autocomplete-list");

let currentItem = -1;

input.addEventListener("input", function(e) {
    const inputVal = this.value;
    closeAllLists();
    if (!inputVal) return false;

    // 创建包含匹配项的容器
    const matches = countries.filter(country =>
        country.toLowerCase().includes(inputVal.toLowerCase())
    );
    currentItem = -1;

    if (matches.length > 0) {
        autocompleteList.innerHTML = matches.map(country =>
            `<div onclick="selectValue('${country}')">${highlightMatch(country, inputVal)}</div>`
        ).join('');
        autocompleteList.style.display = 'block';
    } else {
        autocompleteList.innerHTML = `<div>无匹配结果</div>`;
        autocompleteList.style.display = 'block';
    }
});

// 高亮匹配文本
function highlightMatch(text, match) {
    const regex = new RegExp(`(${match})`, 'gi');
    return text.replace(regex, '<strong>$1</strong>');
}

// 选择值
function selectValue(value) {
    input.value = value;
    closeAllLists();
}

// 关闭所有下拉列表
function closeAllLists() {
    autocompleteList.innerHTML = '';
    autocompleteList.style.display = 'none';
}

// 处理键盘事件
input.addEventListener("keydown", function(e) {
    const items = autocompleteList.getElementsByTagName("div");

    // 向下箭头
    if (e.key === "ArrowDown") {
        currentItem = Math.min(currentItem + 1, items.length - 1);
        setActive(items, currentItem);
    }
    // 向上箭头
    else if (e.key === "ArrowUp") {
        currentItem = Math.max(currentItem - 1, -1);
        setActive(items, currentItem);
    }
    // 回车
    else if (e.key === "Enter") {
        if (currentItem > -1) {
            items[currentItem].click();
        }
    }
});

// 设置当前激活项
function setActive(items, currentItem) {
    for (let i = 0; i < items.length; i++) {
        items[i].classList.remove("autocomplete-active");
        if (i === currentItem) {
            items[i].classList.add("autocomplete-active");
        }
    }
}

// 点击页面其他区域关闭下拉
document.addEventListener("click", function(e) {
    if (e.target !== input && !autocompleteList.contains(e.target)) {
        closeAllLists();
    }
});
</script>

</body>
</html>
