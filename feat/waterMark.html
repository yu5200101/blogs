<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <h1>网页内容</h1>
    <p>加强版防删除水印示例</p>

    <script>
      // 水印安全配置
      const WATERMARK_CONFIG = {
          ID: {
            key: 'id',
            value: 'secure-watermark-layer'
          },
          DATA_ATTR: {
            key: 'data-watermark-secure',
            value: 'locked'
          }
      };
      // 生成动态水印图像（带时间戳）
      const generateWatermark = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 300;
          canvas.height = 200;
          const ctx = canvas.getContext('2d');
          ctx.font = '18px Arial';
          ctx.fillStyle = 'rgba(180, 180, 180, 0.4)';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.translate(150, 100);
          ctx.rotate(-30 * Math.PI / 180);
          ctx.fillText('测试水印', 0, 0);
          ctx.fillText(new Date().toLocaleString(), 0, 30);
          // 动态内容（保证每次图像不同）
          const dynamicText = `动态标识 ${Math.random().toString(36).substr(2, 5)}`;
          ctx.fillText(dynamicText, 0, 50);  // 在不可见区域添加
          // 添加随机参数防止缓存
          return canvas.toDataURL()
      };
      // 创建受保护的水印层
      const createProtectedWatermark = () => {
          const div = document.createElement('div');
          div.id = WATERMARK_CONFIG.ID.value
          div.setAttribute(WATERMARK_CONFIG.DATA_ATTR.key, WATERMARK_CONFIG.DATA_ATTR.value);
          Object.assign(div.style, {
              position: 'fixed',
              top: '0',
              left: '0',
              width: '100vw',
              height: '100vh',
              backgroundRepeat: 'repeat',
              pointerEvents: 'none',
              zIndex: '2147483647', // 最大z-index值
              display: 'block !important',
              opacity: '1 !important',
              visibility: 'visible !important',
              backgroundImage: `url("${generateWatermark()}")`
          });
          document.body.prepend(div);
      };
      // 防护策略核心
      const initWatermarkProtection = () => {
          // 1. DOM结构防护-删除dom重新渲染
          const protectDomStructure = () => {
              const domObserver = new MutationObserver(() => {
                  if (!document.getElementById(WATERMARK_CONFIG.ID.value)) {
                      console.log('protectDomStructure')
                      createProtectedWatermark();
                  }
              });
              domObserver.observe(document.body, { childList: true });
          };
          // 2 WATERMARK_CONFIG属性检测
          // 更改id和data-watermark-secure的value值时
          const protectAttribute = () => {
            // 方法2：属性篡改防护
            const observer = new MutationObserver(mutations => {
                mutations.forEach(mutation => {
                    const target = mutation.target;
                    // 变更前的逻辑判断
                    if (target.id === WATERMARK_CONFIG.ID.value ||
                        target.hasAttribute(WATERMARK_CONFIG.DATA_ATTR.key)) {
                        // 变更后的逻辑判断:
                        Object.keys(WATERMARK_CONFIG).forEach(item => {
                          if (mutation.attributeName === WATERMARK_CONFIG[item].key &&
                          target.getAttribute(WATERMARK_CONFIG[item].key) !== WATERMARK_CONFIG[item].value) {
                            console.log('protectAttribute')
                            target.setAttribute(WATERMARK_CONFIG[item].key, WATERMARK_CONFIG[item].value)
                          }
                        })
                    }
                });
            });
            observer.observe(document.documentElement, {
              attributes: true,
              attributeFilter: Object.keys(WATERMARK_CONFIG).map(item => WATERMARK_CONFIG[item].key),
              subtree: true
            });
          }
          // 2. 定时刷新策略
          const startRefreshInterval = () => {
              setInterval(() => {
                const target = document.getElementById(WATERMARK_CONFIG.ID.value)
                console.log('startRefreshInterval')
                // 强制恢复关键属性
                Object.assign(target.style, {
                  position: 'fixed',
                  top: '0',
                  left: '0',
                  width: '100vw',
                  height: '100vh',
                  backgroundRepeat: 'repeat',
                  pointerEvents: 'none',
                  zIndex: '2147483647', // 最大z-index值
                  display: 'block !important',
                  opacity: '1 !important',
                  visibility: 'visible !important',
                  backgroundImage: `url("${generateWatermark()}")`
                })
              }, 5000); // 每5秒刷新水印内容
          };
          protectDomStructure();
          protectAttribute()
          startRefreshInterval();
      };
      // 初始化
      createProtectedWatermark();
      initWatermarkProtection();
    </script>
</body>
</html>
