<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
</head>
<body>
</body>
<script>
  function jsonp ({url, params, cb}) {
    return new Promise((resolve, reject) => {
      // 创建script标签
      // 引入script标签，会把script返回的内容执行一遍，调用jsonp请求，返回show('hello')，则执行show('hello')，会在全局找show方法并且执行
      let script = document.createElement('script');
      // 将回调函数挂载在window上
      window[cb] = function(data) {
        console.log(data, 'window[cb]')
        resolve(data);
        // 代码执行后，删除插入的script标签
        document.body.removeChild(script);
      }
      // 回调函数加在请求地址上
      params = {...params, cb};//wb=b&cb=show
      const ary = Object.keys(params).map(key => `${key}=${params[key]}`)
      script.src = `${url}?${ary.join('&')}`;
      console.log(script.src, 'script')
      document.body.appendChild(script);
    })
  }
  jsonp({
      url: 'http://localhost:3000/say',
      params: {
      },
      cb: 'show'
  }).then(data => {
    console.log(data, 'then');
  })
</script>

</html>
