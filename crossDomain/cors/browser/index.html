<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
</head>
<body>
  <div>cors</div>
</body>
<script>
  // 简单请求
  function simpleRequest() {
    let xhr = new XMLHttpRequest();
    document.cookie = 'name=xiamen'; // cookie不能跨域
    xhr.withCredentials = true; // 前端设置是否带cookie
    // method: get/post等
    // url: 请求的api
    // async: true 异步
    // xhr.open(method, url, async)
    // get
    xhr.open('get', 'http://localhost:4000/getData', true);
    xhr.onreadystatechange = function() {
      if(xhr.readyState === 4) {
        if((xhr.status >=200 && xhr.status < 300) || xhr.status === 304) {
          console.log(xhr.response, 'response');
           //得到响应头，后台需设置Access-Control-Expose-Headers
          console.log(xhr.getResponseHeader('serve-name'));
        }
      }
    }
    xhr.send()
  }
  simpleRequest()
  // 非简单请求
  function notSimpleRequest() {
    // 预检请求+响应字段
    let xhr = new XMLHttpRequest();
    document.cookie = 'name=xiamen'; // cookie不能跨域
    xhr.withCredentials = true; // 前端设置是否带cookie
    xhr.open('get', 'http://localhost:4000/getData', true);
    // setRequestHeader为非简单请求，表示预检请求
    // xhr.setRequestHeader('name', 'xiamen');
    // 在预检请求的响应返回后,会先触发options，若请求header不满足响应头的条件，则会触发XMLHttpRequest的onError事件，那么cors请求也不会发出去了。
    // xhr.setRequestHeader('name1', 'xiamen');
    xhr.onreadystatechange = function() {
      if(xhr.readyState === 4) {
        if((xhr.status >=200 && xhr.status < 300) || xhr.status === 304) {
          console.log(xhr.response, 'response');
           //得到响应头，后台需设置Access-Control-Expose-Headers
          console.log(xhr.getResponseHeader('serve-name'));
        }
      }
    }
    xhr.send()
  }
  // notSimpleRequest()
</script>
</html>
