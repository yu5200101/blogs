<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue2 DOM Diff 算法实现</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
        }
        .demo-area {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 20px 0;
            min-height: 100px;
        }
        .node {
            margin-left: 20px;
        }
        .diff-added {
            background-color: #cfc;
        }
        .diff-removed {
            background-color: #fcc;
        }
        .diff-updated {
            background-color: #ffc;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
  <div class="container">
    <h1>Vue2 DOM Diff 算法实现（重构版）</h1>
    <div>
        <button id="btnDiff">执行Diff比较</button>
        <button id="btnReset">重置</button>
    </div>
    <div class="demo-area">
        <h3>旧DOM结构:</h3>
        <div id="oldDom"></div>
        <hr>
        <h3>新DOM结构:</h3>
        <div id="newDom"></div>
        <hr>
        <h3>Diff结果:</h3>
        <div id="resultDom"></div>
    </div>
    <h3>Diff操作日志:</h3>
    <div id="diffLog" style="height: 200px; overflow-y: auto; border: 1px solid #eee; padding: 10px;"></div>
  </div>
</body>

<script src="./index.js"></script>
